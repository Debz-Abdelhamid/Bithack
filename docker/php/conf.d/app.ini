; PUI-UBMA R13 Patrimoine — PHP runtime settings (dev defaults; prod overrides in prod compose)
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
expose_php = Off

; Opcache — validate timestamps in dev so bind-mounted code changes apply instantly
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
